<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title description">
  <title id="title">Copy the published Package ID into the Sui call</title>
  <desc id="description">Illustrative Sui publish output highlights PackageID under Published Objects. An arrow leads to the same placeholder in the call's --package option. The shared registry object ID is separately shown as the first value after --args. The package digest and created BuilderCard object ID are different values.</desc>

  <rect width="1100" height="440" rx="20" fill="#f6f9ff"/>
  <text x="42" y="44" fill="#142d43" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Where your published Package ID goes</text>
  <text x="42" y="68" fill="#426078" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Illustrative output and call — replace the placeholders with your own IDs</text>

  <rect x="42" y="96" width="480" height="240" rx="14" fill="#112b3e"/>
  <text x="62" y="125" fill="#dbeeff" font-family="Consolas, Liberation Mono, monospace" font-size="15">$ sui client publish</text>
  <text x="62" y="160" fill="#ffffff" font-family="Consolas, Liberation Mono, monospace" font-size="15" font-weight="700">Published Objects</text>
  <rect x="58" y="174" width="448" height="44" rx="7" fill="#1769aa"/>
  <text x="70" y="202" fill="#ffffff" font-family="Consolas, Liberation Mono, monospace" font-size="15" font-weight="700">PackageID: 0xYOUR_PACKAGE_ID</text>
  <text x="62" y="247" fill="#dbeeff" font-family="Consolas, Liberation Mono, monospace" font-size="15">Version: 1</text>
  <text x="62" y="277" fill="#dbeeff" font-family="Consolas, Liberation Mono, monospace" font-size="15">Digest: ...</text>
  <text x="62" y="310" fill="#a9c8df" font-family="Segoe UI, Arial, sans-serif" font-size="13">Copy PackageID, not Digest.</text>

  <path d="M530 195 H568 Q585 195 585 212 V223 Q585 240 602 240 H625" fill="none" stroke="#1769aa" stroke-width="5"/>
  <path d="M625 230 L638 240 625 250Z" fill="#1769aa"/>
  <text x="539" y="170" fill="#1769aa" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">COPY</text>

  <rect x="638" y="96" width="420" height="240" rx="14" fill="#112b3e"/>
  <text x="658" y="125" fill="#dbeeff" font-family="Consolas, Liberation Mono, monospace" font-size="15">$ sui client call \</text>
  <rect x="654" y="174" width="388" height="44" rx="7" fill="#1769aa"/>
  <text x="666" y="202" fill="#ffffff" font-family="Consolas, Liberation Mono, monospace" font-size="15" font-weight="700">--package 0xYOUR_PACKAGE_ID \</text>
  <text x="658" y="248" fill="#dbeeff" font-family="Consolas, Liberation Mono, monospace" font-size="15">--module builder_card \</text>
  <text x="658" y="278" fill="#dbeeff" font-family="Consolas, Liberation Mono, monospace" font-size="15">--function create_builder_card \</text>
  <text x="658" y="308" fill="#dbeeff" font-family="Consolas, Liberation Mono, monospace" font-size="15">--args 0xREGISTRY_OBJECT_ID ...</text>

  <rect x="42" y="356" width="1016" height="57" rx="10" fill="#dbeaf7"/>
  <text x="59" y="380" fill="#1769aa" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Three distinct IDs</text>
  <text x="59" y="400" fill="#426078" font-family="Segoe UI, Arial, sans-serif" font-size="13">Published package → --package</text>
  <text x="380" y="400" fill="#426078" font-family="Segoe UI, Arial, sans-serif" font-size="13">Shared registry → first --args value</text>
  <text x="710" y="400" fill="#426078" font-family="Segoe UI, Arial, sans-serif" font-size="13">Created card → VITE_PORTFOLIO_OBJECT_ID</text>
</svg>
